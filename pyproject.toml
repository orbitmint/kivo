[project]
name = "kivo"
version = "0.1.0"
description = "A Python-based open-source semantic layer MVP"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "sqlglot>=23.0.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0.0",
    "duckdb>=0.9.0",
    "psycopg2-binary>=2.9.0",
    "clickhouse-connect>=0.6.0",
    "google-cloud-bigquery>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/kivo",
    "/README.md"
]

[tool.hatch.build.targets.wheel]
packages = ["src/kivo"]
